[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-observability"
version = "0.1.0"
description = "Domain-agnostic RAG pipeline with OpenTelemetry observability and operational governance."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-text-splitters",
  "pydantic>=2.7",
  "pydantic-settings",
  "python-frontmatter",
  "python-dotenv",
  "PyYAML",
  "fastapi",
  "uvicorn",
  "opentelemetry-api",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
]

[project.optional-dependencies]
openai = ["langchain-openai"]
anthropic = ["langchain-anthropic"]
google = ["langchain-google-genai"]
ollama = ["langchain-ollama"]
pgvector = ["langchain-postgres", "psycopg[binary]"]
dev = ["pytest", "httpx"]

[project.scripts]
rag-chat = "rag_observability.cli.chat:main"
rag-ingest = "rag_observability.ingestion.ingest:main"
rag-index = "rag_observability.ingestion.index:main"
rag-retrieve = "rag_observability.cli.retrieve:main"
rag-doctor = "rag_observability.cli.doctor:main"

[tool.setuptools.packages.find]
include = ["rag_observability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
