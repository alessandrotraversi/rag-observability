# Price table used by governance to ESTIMATE cost (not billing).
# USD per million tokens. Values below are illustrative placeholders — replace them
# with your provider's current price list before relying on the budget.
# Every model in AI_ALLOWED_MODELS must resolve to an entry (exact name, longest
# prefix, or `default`), otherwise the application refuses to start.
currency: USD
models:
  gpt-4.1-mini:
    input_per_million: 0.40
    output_per_million: 1.60
  gpt-4.1:
    input_per_million: 2.00
    output_per_million: 8.00
  gpt-4o-mini:
    input_per_million: 0.15
    output_per_million: 0.60
  claude-haiku-4-5:
    input_per_million: 1.00
    output_per_million: 5.00
  claude-sonnet-4-5:
    input_per_million: 3.00
    output_per_million: 15.00
  gemini-2.5-flash:
    input_per_million: 0.30
    output_per_million: 2.50
  llama3.1:            # local (Ollama): no provider bill, budget still counts tokens at 0
    input_per_million: 0.0
    output_per_million: 0.0
# Uncomment to price any unknown model (safer to leave it off and fail fast):
# default:
#   input_per_million: 1.0
#   output_per_million: 4.0
